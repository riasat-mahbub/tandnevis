<body><header class="appbar"><div class="identity"><span class="brand" id="brand"></span><span class="project-name">The Imperial College</span></div><div class="actions"><button class="library-button" id="library-open"></button><span class="header-line"></span><span class="save-status" id="save-status"></span><button class="outline small" id="save-btn">Save</button></div></header><main id="root" class="shell"></main><footer class="demo-footer">Tandnevis workspace concept · Sample manuscript · All changes and draft generation are simulated locally.</footer><dialog class="library-dialog" id="library"></dialog><dialog class="new-dialog" id="create"></dialog><div class="toast" id="toast" hidden role="status"></div>
<script>
const icons={feather:'<path d="M20 4c-5-3-11 0-14 5-2 3-2 6-2 10l6-6 5-1 6-6Z"/><path d="m3 21 12-12M10 13h5"/>',book:'<path d="M3 5h6a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H3zM21 5h-6a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h6z"/>',library:'<path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l4-1 3 15-4 1z"/>',arrow:'<path d="M19 12H5m7-7-7 7 7 7"/>',chevron:'<path d="m9 6 6 6-6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',search:'<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.9"/><circle cx="9" cy="7" r="3"/><path d="M16 4a3 3 0 0 1 0 6"/>',user:'<circle cx="12" cy="8" r="3"/><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/>',heart:'<path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1Z"/>',tone:'<path d="M4 5h16v12H9l-5 4z"/><path d="M8 9h8M8 13h5"/>',sliders:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="18" r="2" fill="currentColor"/>',panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m8-11-3 3 3 3"/>',spark:'<path d="M12 3l2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3z"/>',list:'<path d="M4 6h12M4 12h12M4 18h8m6-3v6m-3-3h6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',up:'<path d="m7 14 5-5 5 5"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6m4-6v6"/>',columns:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/>',grip:'<path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke-width="3"/>',undo:'<path d="M9 7 4 12l5 5M4 12h10a5 5 0 0 1 5 5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3m0-14-3 3m-8 8-3 3"/>'};
const I=(name)=>`<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${icons[name]||''}</svg>`;
const E=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const chip=(type,name)=>`<span class="chip ${type}" contenteditable="false" data-ref="${type}:${E(name)}">${E(name)}</span>`;
const groups=[{type:'character',label:'Characters',icon:'users',singular:'character',items:[['Murad','Royal heir; curious, perceptive, and kind.'],['Rudra','Reserved scholar with a guarded agenda.'],['Usha','Proud and determined; proves herself through hard work.'],['Rafiq','A loyal friend with an interest in poetry.'],['Vikram','A student raised in the traditions of the Rajput court.'],['Salima','A former attendant with a gift for music.'],['Aisha','Protective and independent-minded.'],['Rustam','A lancer with strong feelings about duty.']]},{type:'emotion',label:'Emotions',icon:'heart',singular:'emotion',items:[['Curiosity','A desire to understand what is not yet known.'],['Amusement','Quiet enjoyment of a situation or remark.'],['Suspicion','A sense that something is being concealed.'],['Pride','Confidence in an accomplishment or identity.'],['Anxiety','Unease in anticipation of an uncertain outcome.'],['Embarrassment','Discomfort at being exposed or noticed.'],['Relief','The easing of tension after a threat passes.'],['Determination','A sustained commitment to a goal.']]},{type:'tone',label:'Tones',icon:'tone',singular:'tone',items:[['Playful','Light, nimble writing that allows gentle humour.'],['Tense','Controlled pacing and a sense of pressure.'],['Dry humour','Understatement and precise, understated irony.'],['Warm','An affectionate or generous narrative voice.'],['Formal','Measured phrasing and restrained presentation.'],['Melancholic','Reflective writing tinged with sadness.'],['Wry','An observant, subtly ironic voice.'],['Solemn','A serious, measured atmosphere.']]}];
const sc=(title,excerpt,summary,beats)=>({title,excerpt,summary,beats,prose:'',drafts:{},pov:'Third person, close to Murad',tense:'Past',instructions:''});
const chapters=[{title:'The Arrival',desc:'The royal procession reaches the Imperial College, where the new students begin to encounter one another.',scenes:[sc('The Procession','A stubborn mule interrupts the royal arrival, giving Murad a rare chance to observe the academy from the road.',`${chip('character','Murad')} arrives at the academy with ${chip('character','Rafiq')}. A delay in the procession lets him observe the crowd. Keep the incident ${chip('tone','Playful')}, rather than ceremonial.`,[`The procession stops when a mule refuses to move. ${chip('character','Murad')} leans forward with ${chip('emotion','Curiosity')}, trying to see beyond the animal.`,` ${chip('character','Rafiq')} advises him to stay seated. The officer’s increasingly elaborate instructions lend the delay ${chip('tone','Dry humour')}.`]),sc('An Unexpected Meeting','An offhand exchange at the academy gate introduces Murad to a stranger who seems to know rather more than he should.',`${chip('character','Murad')} encounters ${chip('character','Rudra')} outside the academy gates. Their conversation is ${chip('tone','Playful')} on the surface, but leaves Murad with a growing sense of ${chip('emotion','Suspicion')}.`,[`${chip('character','Rudra')} makes an offhand remark about the procession. ${chip('character','Murad')} replies without revealing who he is.`,`When Rudra addresses him by his proper title, ${chip('character','Murad')} feels a moment of ${chip('emotion','Embarrassment')}. He realises that his identity was never a secret.`]),sc('The Opening Ceremony','The new students assemble and the academy announces its new hall leaders.','The students gather in the great hall. Establish the academy’s traditions and the expectations placed on the new leaders.', ['The doors open and the students file into the assembly hall.'])]},{title:'First Impressions',desc:'The first assessment overturns expectations and establishes the earliest rivalries among the students.',scenes:[sc('The Assessment','Usha surprises her classmates by finishing ahead of the expected favourites.',`${chip('character','Usha')} takes part in the opening assessment. She is initially underestimated, and her ${chip('emotion','Determination')} carries her through.`,[`${chip('character','Usha')} is assigned a difficult task. She studies the instructions without responding to the examiner’s doubts.`]),sc('A New Rivalry','An unexpected result forces two students to reassess their assumptions.','The results are announced. Let the rivalry develop naturally.', ['The students gather near the noticeboard.'])]},{title:'The First Week',desc:'Daily life at the academy brings its first small conflicts, shared jokes, and unexpected friendships.',scenes:[sc('A Misunderstanding','A harmless incident becomes a dispute over courtesy and reputation.','A small dispute escalates between classmates.', ['A group of students misinterprets a remark.']),sc('The Detention','Three students find themselves together under unusual circumstances.','The three students share a detention.', ['The students arrive at the room one at a time.'])]},{title:'The Festival',desc:'A rare moment of celebration brings the halls together and briefly interrupts their rivalries.',scenes:[sc('Preparations','The students prepare for a festival on the academy grounds.','Preparations for the festival bring the students together.', ['Students decorate the courtyard.'])]}];
let level='story',ci=0,si=0,expanded={},libraryExpanded={},shelfOpen=window.innerWidth>780,shelfSearch='',librarySearch='',libSelected=null,review=null,dirty=false,lastEditable=null,lastRange=null,createType=null,wizardStep=0,wizardName='',wizardProfile='',toastTimer;const scrolls={};
const root=document.querySelector('#root'),lib=document.querySelector('#library'),createDialog=document.querySelector('#create');const scene=()=>chapters[ci].scenes[si];const key=()=>level==='story'?'story':level==='chapter'?`ch:${ci}`:`sc:${ci}:${si}`;const allScenePairs=()=>chapters.flatMap((c,i)=>c.scenes.map((s,j)=>[i,j]));
const markDirty=()=>{dirty=true;document.querySelector('#save-status').innerHTML='Unsaved changes';};const notify=(msg)=>{const t=document.querySelector('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2400)};
function nav(next,c=ci,s=si){scrolls[key()]=window.scrollY;level=next;ci=c;si=s;review=null;lastEditable=null;lastRange=null;render();window.scrollTo(0,scrolls[key()]||0);}
function openChapter(i){nav('chapter',i,0)}function openScene(i,j){nav('scene',i,j)}function zoomOut(){if(level==='scene')nav('chapter');else if(level==='chapter')nav('story');}function adjacent(delta){const pairs=allScenePairs(),i=pairs.findIndex(p=>p[0]===ci&&p[1]===si);if(pairs[i+delta])openScene(...pairs[i+delta]);}
const B=(label,icon,attr='',cls='')=>`<button class="${cls}" ${attr}>${icon?I(icon):''}${label}</button>`;
function breadcrumbs(isScene=false){return `<div class="breadcrumbs">${B('Zoom out','arrow','data-action="zoom-out" aria-label="Zoom out one level"','outline small')} ${B('Story','book','data-go="story"','')} ${I('chevron')} ${isScene?B(E(chapters[ci].title),null,'data-go="chapter"',''):`<strong>${E(chapters[ci].title)}</strong>`}${isScene?`${I('chevron')}<strong>${E(scene().title)}</strong>`:''}</div>`}
function renderStory(){return `<section class="canvas"><div class="canvas-header"><div><h1>The Imperial College</h1><p>${chapters.length} chapters · ${allScenePairs().length} scenes</p></div>${B('New chapter','plus','data-action="new-chapter"','primary')}</div><div class="chapter-table"><div class="table-labels"><span>Chapter</span><span>Narrative</span><span>Scene outline</span><span></span></div>${chapters.map((c,i)=>`<button class="chapter-row" data-chapter="${i}" aria-label="Open chapter ${E(c.title)}"><span class="number num">${String(i+1).padStart(2,'0')}</span><span><span class="chapter-name" style="display:block">${E(c.title)}</span><span class="chapter-description" style="display:block">${E(c.desc)}</span></span><span class="scene-preview">${c.scenes.slice(0,3).map(s=>`<span class="preview-item"><span class="preview-dot"></span>${E(s.title)}</span>`).join('')}${c.scenes.length>3?`<span class="smalltext">+ ${c.scenes.length-3} more</span>`:c.scenes.length===0?'<span>No scenes yet</span>':''}</span>${I('chevron')}</button>`).join('')}</div><div class="story-footer"><span>Open any chapter to move closer to the story.</span><span>Illustrative manuscript</span></div></section>`}
function renderChapter(){const c=chapters[ci];return `<section class="canvas chapter-canvas">${breadcrumbs()}<div class="canvas-header"><div><h1>${E(c.title)}</h1><p>Chapter ${ci+1} of ${chapters.length} · ${c.scenes.length} scenes</p></div>${B('New scene','plus','data-action="new-scene"','primary')}</div><p class="chapter-intro">${E(c.desc)}</p><div class="scene-list">${c.scenes.map((s,j)=>`<article class="scene-card"><span class="node num">${j+1}</span><button class="scene-open" data-scene="${j}"><span><span class="scene-name" style="display:block">${E(s.title)}</span><span class="scene-excerpt" style="display:block">${E(s.excerpt)}</span><span class="scene-meta"><span>${s.beats.length} beats</span><span class="open">Open scene ${I('chevron')}</span></span></span></button><div class="scene-tools">${B('','up',`data-move-scene="${j},-1" aria-label="Move scene up" ${j===0?'disabled':''}`,'icon')}${B('','down',`data-move-scene="${j},1" aria-label="Move scene down" ${j===c.scenes.length-1?'disabled':''}`,'icon')}</div></article>`).join('')||'<p class="muted">Start this chapter with a new scene.</p>'}</div></section>`}
function renderGroups(query,library=false){return groups.map(g=>{let items=g.items.filter(x=>x.join(' ').toLowerCase().includes(query.toLowerCase()));const ex=(library?libraryExpanded[g.type]:expanded[g.type])||query,limit=library?3:4,visible=ex?items:items.slice(0,limit);return `<section class="${library?'lib-group':'object-group'}"><div class="group-head">${I(g.icon)}<${library?'h2':'h3'}>${g.label}</${library?'h2':'h3'}>${library?`<span class="count">${items.length} definitions</span>`:''}${B(library?'New '+g.singular:'', 'plus',`data-new="${g.type}" aria-label="New ${g.singular}"`,library?'outline small':'icon')}</div><div class="${library?'lib-items':'chips'}">${visible.map(([name,desc])=>library?`<button class="lib-row" data-object="${g.type}:${E(name)}"><span class="lib-icon ${g.type}">${I(g.type==='character'?'user':g.icon)}</span><span><strong>${E(name)}</strong><small>${E(desc)}</small></span>${I('chevron')}</button>`:`<button class="block-btn ${g.type}" data-insert="${g.type}:${E(name)}" title="${E(desc)}" draggable="true">${I(g.type==='character'?'user':g.icon)}${E(name)}</button>`).join('')||'<span class="empty-mini">No matching definitions</span>'}</div>${items.length>limit&&!query?B(ex?'Show fewer':`Show all ${items.length}`,ex?'up':'down',`${library?'data-lib-expand':'data-expand'}="${g.type}" aria-expanded="${!!ex}"`,'group-more'):''}</section>`}).join('')}
function shelf(){return shelfOpen?`<aside class="shelf"><div class="shelf-top"><strong>Writing tools</strong>${B('','panel','data-action="toggle-shelf" aria-label="Collapse writing tools"','icon')}</div><div class="searchbox">${I('search')}<input aria-label="Search all story blocks" placeholder="Find a block..." id="shelf-search" value="${E(shelfSearch)}"></div><div id="shelf-groups">${renderGroups(shelfSearch)}</div><details class="settings-disclosure" id="settings"><summary>${I('sliders')} Scene settings ${I('down')}</summary><label>Point of view<input data-narration="pov" value="${E(scene().pov)}"></label><label>Tense<input data-narration="tense" value="${E(scene().tense)}"></label><label>Narration instructions<textarea data-narration="instructions" rows="3">${E(scene().instructions)}</textarea></label></details></aside>`:`<aside class="shelf shelf-rail">${B('','panel','data-action="toggle-shelf" aria-label="Expand writing tools"','icon')}${B('','search','data-action="open-shelf-search" aria-label="Search story blocks"','icon')}</aside>`}
function summary(){return `<section class="summary-paper editable"><div class="section-heading"><span class="label">Scene summary</span><span class="muted smalltext">Freeform direction</span></div><div class="writing" contenteditable="true" role="textbox" aria-label="Scene summary" data-editor="summary" spellcheck="false">${scene().summary}</div></section>`}
function beats(){return `<div class="beat-heading"><h2>Beats</h2><span class="smalltext muted">${scene().beats.length} moments</span></div><div class="beats">${scene().beats.map((b,j)=>`<section class="beat editable"><span class="beat-number num">${j+1}</span><div class="beat-label"><span>Beat ${j+1}</span><span>${B('','up',`data-move-beat="${j},-1" aria-label="Move beat up" ${j===0?'disabled':''}`,'icon')}${B('','down',`data-move-beat="${j},1" aria-label="Move beat down" ${j===scene().beats.length-1?'disabled':''}`,'icon')}${B('','trash',`data-delete-beat="${j}" aria-label="Delete beat ${j+1}"`,'icon')}</span></div><div class="writing" contenteditable="true" role="textbox" aria-label="Beat ${j+1}" data-editor="beat:${j}" spellcheck="false">${b}</div></section>`).join('')||'<p class="muted">Describe the first moment of this scene.</p>'}</div>${B('Add beat','plus','data-action="add-beat"','outline small add-beat')}`}
function prose(){return `<section class="prose-editor"><div class="section-heading"><h2>Scene prose</h2>${scene().drafts.prose?B('Review draft','columns','data-review="prose"','draft-link'):''}</div><div class="writing" contenteditable="true" role="textbox" aria-label="Scene prose" data-editor="prose" spellcheck="false">${scene().prose||''}</div>${!scene().prose?'<p class="smalltext muted" style="margin-top:8px">Write directly here, or generate a prose draft to review beside your writing.</p>':''}</section>`}
function sampleDraft(purpose){const s=scene();if(purpose==='beats'){if(ci===0&&si===0)return [`${chip('character','Murad')} notices that the crowd has begun to laugh. He suppresses his own ${chip('emotion','Amusement')} so the officer does not lose face.`,`The mule moves of its own accord just as the officer prepares another instruction. End the moment with ${chip('tone','Dry humour')} and allow the procession to continue.`];if(ci===0&&si===1)return [`${chip('character','Murad')} asks how ${chip('character','Rudra')} knew his name. Rudra avoids answering directly; let the exchange feel ${chip('tone','Dry humour')}.`,`Murad leaves with ${chip('emotion','Suspicion')}. Rudra watches him go, satisfied that the brief encounter revealed something useful.`];return [`Extend the existing events with a concrete response from the characters. Keep the action consistent with the scene’s direction.`,`End on a consequence of that response, preparing the reader for the next scene.`];}if(ci===0&&si===0)return `<p>The mule had stopped.</p><p>Murad leaned forward to see past the bedding tied across its back. An attendant was explaining the situation to the animal with the patient gravity of a man addressing his superior.</p><p>“If you get down,” Rafiq said, touching his sleeve, “they'll have to stop the people behind us.”</p><p>“They have stopped already.”</p><p>“For the mule.”</p><p>Before the officer could issue his next instruction, the mule took three unhurried steps towards the gates. Murad settled back in his seat.</p>`;return `<p>Outside the academy gates, the crowd was beginning to thin. Murad had scarcely finished speaking when the stranger addressed him by his proper title.</p><p>He hesitated. He had been rather pleased with himself for keeping that detail to himself.</p><p>“You knew?” he asked.</p><p>The stranger smiled. “Was I supposed not to?”</p>`;}
function reviewContent(){const p=review, draft=scene().drafts[p];if(!draft)return '';return `<div class="review-banner"><div>${I('columns')}<h2>${p==='beats'?'Review proposed beats':'Review prose draft'}</h2><span class="state">Sample draft · not applied</span></div><div>${B('Close review','close','data-action="close-review"','small outline')}</div></div><div class="review-grid"><div class="review-column"><h3>${p==='beats'?'Current scene direction':'Current manuscript'}</h3><p class="description">${p==='beats'?'Your summary and existing beats remain editable.':'Compare the draft with your existing prose and source direction.'}</p>${p==='beats'?summary()+beats():`<section class="summary-paper editable"><div class="section-heading"><span class="label">Existing prose</span></div><div class="writing" contenteditable="true" role="textbox" aria-label="Scene prose" data-editor="prose">${scene().prose||''}</div>${!scene().prose?'<p class="empty-prose">No prose has been written yet.</p>':''}</section>${summary()}${beats()}`}</div><aside class="review-column proposal"><h3>${p==='beats'?'New beats to append':'Generated prose'}</h3><p class="description">${p==='beats'?`${draft.length} proposed moments follow your existing ${scene().beats.length} beats. They will be appended, not replace them.`:'Accepting replaces the existing scene prose. Your summary and beats stay unchanged.'}</p>${p==='beats'?draft.map((b,j)=>`<div class="proposed-beat"><div class="beat-label"><span>New beat ${scene().beats.length+j+1}</span></div><div class="writing">${b}</div></div>`).join(''):`<div class="draft-prose">${draft}</div>`}<div class="review-footer">${B('Discard',null,'data-action="discard"','small outline')}${B(p==='beats'?'Append '+draft.length+' beats':'Accept prose','check','data-action="accept"','primary')}</div></aside></div>`}
function renderScene(){const s=scene(),pairs=allScenePairs(),idx=pairs.findIndex(p=>p[0]===ci&&p[1]===si);return `<div class="scene-editor ${shelfOpen?'':'shelf-closed'}">${shelf()}<div class="desk"><div class="scene-toolbar">${breadcrumbs(true)}<div class="gen-actions">${B('Generate beats','list','data-generate="beats"','primary')}${B('Generate prose','spark','data-generate="prose"','outline')}${!review&&Object.keys(s.drafts).length?B('Review draft','columns','data-review="'+Object.keys(s.drafts)[0]+'"','small'):''}</div></div><div class="scene-area ${review?'review':''}"><div class="scene-title-row"><h1>${E(s.title)}</h1><div class="adjacent">${B('Previous','arrow',`data-action="prev" ${idx===0?'disabled':''}`,'small')}${B('Next','chevron',`data-action="next" ${idx===pairs.length-1?'disabled':''}`,'small')}</div></div>${review?reviewContent():summary()+beats()+prose()}</div></div></div>`}
function render(){root.innerHTML=level==='story'?renderStory():level==='chapter'?renderChapter():renderScene();}
function renderLibrary(){lib.innerHTML=`<div class="lib-head"><div><h1>Story Library</h1><p>Project-wide characters, emotions and tones</p></div>${B('','close','data-lib-action="close" aria-label="Close library"','icon')}</div><div class="lib-body" id="lib-body">${libSelected?renderDetail():`<div class="searchbox">${I('search')}<input id="lib-search" value="${E(librarySearch)}" aria-label="Search all definitions" placeholder="Search characters, emotions and tones..."></div><div id="lib-groups">${renderGroups(librarySearch,true)}</div>`}</div>`;}
function renderDetail(){const [t,n]=libSelected.split(':'),g=groups.find(g=>g.type===t),item=g.items.find(x=>x[0]===n);if(!item){libSelected=null;return renderGroups(librarySearch,true)}const usages=chapters.flatMap((c,i)=>c.scenes.map((s,j)=>({s,i,j}))).filter(o=>(o.s.summary+o.s.beats.join(' ')).includes(`data-ref="${t}:${E(n)}"`));return `<div class="lib-detail">${B('All definitions','arrow','data-lib-action="back"','text')}<h2>${E(n)}</h2><span class="chip ${t}">${g.label.slice(0,-1)}</span><label for="definition-description">${t==='character'?'Profile overview':'Meaning and writing guidance'}</label><textarea id="definition-description" rows="5">${E(item[1])}</textarea><p class="smalltext muted" style="margin-top:8px">The existing full ${g.singular} editor remains available in the production app. This prototype illustrates the shared browser.</p><div class="new-actions">${B('Save definition','check','data-lib-action="save"','primary')}</div><div class="usage"><h2 style="font-size:21px">Used in</h2>${usages.length?usages.map(o=>`<button class="lib-row" data-usage="${o.i},${o.j}">${I('book')}<span>${E(o.s.title)}<small>${E(chapters[o.i].title)}</small></span>${I('chevron')}</button>`).join(''):'<p>Not referenced in the sample manuscript.</p>'}</div></div>`}
function showLibrary(){libSelected=null;librarySearch='';renderLibrary();lib.showModal();lib.querySelector('#lib-search')?.focus();}
function newObject(type){createType=type;wizardStep=0;wizardName='';wizardProfile='';renderCreate();createDialog.showModal();}
function renderCreate(){const g=groups.find(g=>g.type===createType),isCharacter=createType==='character';let body='';if(isCharacter){const steps=['Starting point','Name & icon','Profile','Review'];body=`<div class="wizard-steps">${steps.map((s,i)=>`<span class="${i===wizardStep?'current':''}">${i+1}. ${s}</span>`).join('')}</div>${wizardStep===0?'<p>Use the existing character wizard. The production app retains its stock archetypes and blank starting point.</p><label for="start">Starting point</label><select id="start"><option>Blank character</option><option>Stock archetype (illustration)</option></select>':wizardStep===1?`<label for="new-name">Character name</label><input id="new-name" value="${E(wizardName)}" placeholder="Name">`:wizardStep===2?`<label for="new-profile">Profile overview</label><textarea id="new-profile" rows="4">${E(wizardProfile)}</textarea>`:`<p><strong>${E(wizardName||'New character')}</strong></p><p>${E(wizardProfile||'No profile details yet.')}</p>`}`;}else body=`<p>Create a reusable ${g.singular} definition.</p><label for="new-name">Name</label><input id="new-name" placeholder="Name" value="${E(wizardName)}"><label for="new-profile">Meaning and guidance</label><textarea id="new-profile" rows="3">${E(wizardProfile)}</textarea>`;createDialog.innerHTML=`<div class="new-inner"><h2>New ${g.singular}</h2>${body}<div class="new-actions">${B(wizardStep>0&&isCharacter?'Back':'Cancel',null,'data-create="back"','outline')}${B(isCharacter&&wizardStep<3?'Continue':'Create '+g.singular,null,'data-create="next"','primary')}</div></div>`}
function rememberSelection(){const sel=window.getSelection();if(!sel||!sel.rangeCount)return;const r=sel.getRangeAt(0),node=r.commonAncestorContainer;const ed=(node.nodeType===1?node:node.parentElement)?.closest('[data-editor]');if(ed&&ed.isConnected){lastEditable=ed;lastRange=r.cloneRange()}}
function saveEditor(ed){const k=ed.dataset.editor,s=scene();if(k==='summary')s.summary=ed.innerHTML;else if(k==='prose')s.prose=ed.innerHTML;else if(k.startsWith('beat:'))s.beats[+k.split(':')[1]]=ed.innerHTML;markDirty();}
function insertBlock(type,name){let ed=lastEditable?.isConnected?lastEditable:root.querySelector('[data-editor="summary"]');if(!ed)return;let range=lastRange&&ed.contains(lastRange.commonAncestorContainer)?lastRange:document.createRange();if(!lastRange||!ed.contains(range.commonAncestorContainer)){range.selectNodeContents(ed);range.collapse(false)}range.deleteContents();const frag=range.createContextualFragment(chip(type,name)+'&nbsp;');const tail=frag.lastChild;range.insertNode(frag);range.setStartAfter(tail);range.collapse(true);ed.focus();let sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);lastEditable=ed;lastRange=range.cloneRange();saveEditor(ed)}
function doGenerate(p){scene().drafts[p]=sampleDraft(p);review=p;render();window.scrollTo(0,0);notify('Illustrative '+(p==='beats'?'beat':'prose')+' draft ready. No AI request was sent.');}
function reorder(arr,j,d){if(j+d>=0&&j+d<arr.length){[arr[j],arr[j+d]]=[arr[j+d],arr[j]];markDirty();render();}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.chapter!==undefined)return openChapter(+d.chapter);if(d.scene!==undefined)return openScene(ci,+d.scene);if(d.go)return nav(d.go);if(d.generate)return doGenerate(d.generate);if(d.review){review=d.review;render();window.scrollTo(0,0);return}if(d.insert){let [t,n]=d.insert.split(':');return insertBlock(t,n)}if(d.expand){expanded[d.expand]=!expanded[d.expand];document.querySelector('#shelf-groups').innerHTML=renderGroups(shelfSearch);return}if(d.new)return newObject(d.new);if(d.moveScene){let [j,v]=d.moveScene.split(',').map(Number);return reorder(chapters[ci].scenes,j,v)}if(d.moveBeat){let [j,v]=d.moveBeat.split(',').map(Number);return reorder(scene().beats,j,v)}if(d.deleteBeat!==undefined){scene().beats.splice(+d.deleteBeat,1);markDirty();return render()}switch(d.action){case 'zoom-out':zoomOut();break;case 'toggle-shelf':shelfOpen=!shelfOpen;render();break;case 'open-shelf-search':shelfOpen=true;render();document.querySelector('#shelf-search')?.focus();break;case 'prev':adjacent(-1);break;case 'next':adjacent(1);break;case 'add-beat':scene().beats.push('');markDirty();render();root.querySelector(`[data-editor="beat:${scene().beats.length-1}"]`)?.focus();break;case 'new-chapter':chapters.push({title:'Untitled chapter',desc:'A new chapter.',scenes:[]});markDirty();openChapter(chapters.length-1);break;case 'new-scene':chapters[ci].scenes.push(sc('Untitled scene','A new moment in the story.','',[]));markDirty();openScene(ci,chapters[ci].scenes.length-1);break;case 'close-review':review=null;render();break;case 'discard':delete scene().drafts[review];review=null;render();notify('Proposal discarded. Manuscript unchanged.');break;case 'accept':{const p=review;if(p==='beats')scene().beats.push(...scene().drafts[p]);else scene().prose=scene().drafts[p];delete scene().drafts[p];review=null;markDirty();render();notify(p==='beats'?'Proposed beats appended to the scene.':'Prose draft accepted.');break;}}});
root.addEventListener('mousedown',e=>{if(e.target.closest('[data-insert]'))e.preventDefault()});root.addEventListener('input',e=>{const ed=e.target.closest('[data-editor]');if(ed)saveEditor(ed);if(e.target.id==='shelf-search'){shelfSearch=e.target.value;document.querySelector('#shelf-groups').innerHTML=renderGroups(shelfSearch)}if(e.target.dataset.narration){scene()[e.target.dataset.narration]=e.target.value;markDirty()}});document.addEventListener('selectionchange',rememberSelection);root.addEventListener('dragstart',e=>{const b=e.target.closest('[data-insert]');if(b)e.dataTransfer.setData('text/x-tandnevis-block',b.dataset.insert)});root.addEventListener('dragover',e=>{if(e.target.closest('[data-editor]')&&e.dataTransfer.types.includes('text/x-tandnevis-block'))e.preventDefault()});root.addEventListener('drop',e=>{const ed=e.target.closest('[data-editor]'),d=e.dataTransfer.getData('text/x-tandnevis-block');if(ed&&d){e.preventDefault();let r=document.caretRangeFromPoint?.(e.clientX,e.clientY);if(r&&ed.contains(r.commonAncestorContainer)){lastRange=r;lastEditable=ed}else{lastRange=null;lastEditable=ed}insertBlock(...d.split(':'))}});
lib.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.libExpand){libraryExpanded[d.libExpand]=!libraryExpanded[d.libExpand];document.querySelector('#lib-groups').innerHTML=renderGroups(librarySearch,true);return}if(d.libAction==='close'){lib.close();return}if(d.libAction==='back'){libSelected=null;renderLibrary();return}if(d.object){libSelected=d.object;renderLibrary();return}if(d.new)return newObject(d.new);if(d.usage){lib.close();openScene(...d.usage.split(',').map(Number));return}if(d.libAction==='save'){let [t,n]=libSelected.split(':'),item=groups.find(g=>g.type===t).items.find(x=>x[0]===n);item[1]=document.querySelector('#definition-description').value;markDirty();notify('Definition updated in prototype.');}});lib.addEventListener('input',e=>{if(e.target.id==='lib-search'){librarySearch=e.target.value;document.querySelector('#lib-groups').innerHTML=renderGroups(librarySearch,true)}});
createDialog.addEventListener('click',e=>{let b=e.target.closest('button[data-create]');if(!b)return;wizardName=createDialog.querySelector('#new-name')?.value??wizardName;wizardProfile=createDialog.querySelector('#new-profile')?.value??wizardProfile;if(b.dataset.create==='back'){if(createType==='character'&&wizardStep>0){wizardStep--;renderCreate()}else createDialog.close();return}if(createType==='character'&&wizardStep<3){if(wizardStep===1&&!wizardName.trim()){createDialog.querySelector('#new-name').focus();return}wizardStep++;renderCreate();return}if(!wizardName.trim()){createDialog.querySelector('#new-name')?.focus();return}groups.find(g=>g.type===createType).items.unshift([wizardName.trim(),wizardProfile.trim()||'New reusable definition']);markDirty();createDialog.close();if(lib.open)renderLibrary();else if(level==='scene')document.querySelector('#shelf-groups').innerHTML=renderGroups(shelfSearch);notify('Definition added to the sample library.');});
document.querySelector('#brand').innerHTML=I('feather')+'Tandnevis';document.querySelector('#library-open').innerHTML=I('library')+'Story Library';document.querySelector('#save-status').innerHTML=I('check')+'Demo saved';document.querySelector('#library-open').onclick=showLibrary;document.querySelector('#save-btn').onclick=()=>{dirty=false;document.querySelector('#save-status').innerHTML=I('check')+'Demo saved';notify('Prototype state retained for this session only.');};render();
</script></body></html>
