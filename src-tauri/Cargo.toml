[package]
name = "shorthand-writer"
version = "0.1.0"
description = "A local-first desktop scene writing workspace"
authors = ["Shorthand Writer contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "shorthand_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
